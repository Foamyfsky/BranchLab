[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "branchlab"
version = "0.1.0"
description = "Research pilot for partial observation and intervention in networks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
ui = [
    "plotly>=5.24",
    "streamlit>=1.64",
]

[tool.setuptools.packages.find]
where = ["src"]
